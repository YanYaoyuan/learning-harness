name: CPU tests

on:
  pull_request:
  push:
    branches: [main, power-projection, stage0-validation-20261111]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
