[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-harness-lab"
version = "0.1.0"
description = "Controlled experiments on persistent learning from agent harnesses"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "numpy>=1.24,<3",
    "matplotlib>=3.5,<4",
    "pytest>=6.2,<10",
]

[project.scripts]
lh = "learning_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

